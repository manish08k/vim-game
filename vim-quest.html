const FREE='def total(items):\n    t = 0\n    for i in items:\n        t += i\n    return t\n\n# try anything: dd, ciw, :%s/t/sum/g, qa...';

<div class=c><button onclick=map()>▶ Adventure</button><button onclick=tt()>⏱ Time Trial</button><button onclick="play(-1)">Free Practice</button><button onclick=review()>Review</button><button onclick=prog()>Progress</button></div>

  const vl=v&&S.vl&&(()=>{let x=0,ra=0,rb=0;let pr=0;for(let i=0;i<S.L.length;i++){if(pr<=p0&&p0<=pr+S.L[i].length)ra=i;pr+=S.L[i].length+1}rb=S.r;return r>=Math.min(ra,rb)&&r<=Math.max(ra,rb)})();

 $('#ed').innerHTML=h;$('#st').textContent=S.m=='c'?S.cp+S.cmd:({n:'-- NORMAL --',i:'-- INSERT --',v:S.vl?'-- VISUAL LINE --':'-- VISUAL --'})[S.m]+'  '+S.b+(S.rec?'  recording @'+S.rec:'')+'  '+(S.msg||'')}

 x.fillStyle='#fff8';for(let i=0;i<3;i++)x.fillRect((i*260+sc.t/3)%760-40,20+i*14,50,12);
 sc.hx+=(sc.tx-sc.hx)*.05;let hy=76;if(sc.win){sc.tx=560;hy-=Math.abs(Math.sin(sc.t/6))*30;if(sc.hx>520)sc.dead=1}
